# SwayFX-only settings (blur, rounded corners, shadows). Plain sway does not know these
# commands, so they live here and are pulled in by swayfx.config, never by config.

# rounded window corners, and room between windows for the shadows
corner_radius 8
gaps inner 8

# blur behind see-through windows (the terminal) and behind the bars' menus
blur enable
blur_passes 3
blur_radius 4

# soft drop shadow, a little stronger on the focused window
shadows enable
shadows_on_csd disable
shadow_blur_radius 18
shadow_color #000000A0
shadow_inactive_color #00000060

# unfocused windows are dimmed slightly
default_dim_inactive 0.08

# the bars keep square corners; rofi menus and notifications get blur and a shadow
layer_effects "rofi" blur enable; shadows enable
layer_effects "notifications" blur enable; shadows enable; corner_radius 6
