# SwayFX-only settings (blur, shadows, dimming; corners are kept square). Plain sway does not know these
# commands, so they live here and are pulled in by swayfx.config, never by config.

# square corners; room between windows for the shadows
corner_radius 0
gaps inner 8

# blur behind see-through windows (the unfocused ones, see below) and behind the bars' menus
blur enable
blur_passes 3
blur_radius 4

# soft drop shadow, a little stronger on the focused window
shadows enable
shadows_on_csd disable
shadow_blur_radius 18
shadow_color #000000A0
shadow_inactive_color #00000060

# unfocused windows are dimmed slightly and see-through; the focused window stays solid
default_dim_inactive 0.08
exec ~/.config/sway/inactive-opacity.sh 0.95

# rofi menus and notifications get blur and a shadow
layer_effects "rofi" blur enable; shadows enable
layer_effects "notifications" blur enable; shadows enable

# SwayFX drops the side borders on every config reload; this puts them back (see the script)
exec_always ~/.config/sway/fix-borders.sh
