[General]
# current photo; replaced periodically by sddm/wallpaper.sh (the folder is user-writable)
background=backgrounds/current.jpg
# round profile picture, cut from ~/Pictures/pfp.png by sddm/install.sh; if the file is
# missing the theme draws the user's initial instead
avatar=avatar.png
# font files copied into fonts/ by install.sh; if missing the system font is used
fontRegular=fonts/SF-Pro-Display-Regular.otf
fontSemibold=fonts/SF-Pro-Display-Semibold.otf
fontBold=fonts/SF-Pro-Display-Bold.otf
