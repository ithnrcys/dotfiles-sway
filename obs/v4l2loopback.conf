# Virtual camera for OBS (copied to /etc/modprobe.d/v4l2loopback.conf by obs/install.sh).
# One loopback device at /dev/video10: OBS writes its picture into it ("Start Virtual
# Camera") and Discord, Firefox etc. see it as a webcam named "OBS Virtual Camera".
# exclusive_caps=1 makes it show up as a camera only while OBS is feeding it — Chromium-based
# programs such as Discord ignore the device without this.
options v4l2loopback devices=1 video_nr=10 card_label="OBS Virtual Camera" exclusive_caps=1
