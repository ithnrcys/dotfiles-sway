# Lock screen (hyprlock, started by sway/lock.sh). Laid out to match the SDDM login theme
# in sddm/theme: same photo, date and large clock on top, round profile picture, name and a
# frosted password pill lower down. hyprlock works on sway through the ext-session-lock protocol.

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = ease, 0.25, 0.1, 0.25, 1
    animation = fade, 1, 3, ease
}

# the photo sddm/wallpaper.sh keeps fresh for the login screen; shown sharp, slightly darkened
background {
    monitor =
    path = /usr/share/sddm/themes/glass/backgrounds/current.jpg
    color = rgb(101014)
    blur_passes = 0
    brightness = 0.62
}

# date (weights are set with markup: a weight in the font name is not picked up)
label {
    monitor =
    text = cmd[update:60000] echo "<span font_weight='600'>$(date +"%A, %-d %B")</span>"
    color = rgba(255, 255, 255, 0.85)
    font_size = 20
    font_family = SF Pro Display
    position = 0, -92
    halign = center
    valign = top
}

# clock, 12-hour without the am/pm
label {
    monitor =
    text = cmd[update:1000] echo "<span font_weight='bold'>$(date +"%-I:%M")</span>"
    color = rgba(255, 255, 255, 0.92)
    font_size = 92
    font_family = SF Pro Display
    position = 0, -118
    halign = center
    valign = top
}

# profile picture, cut to a circle
image {
    monitor =
    path = /home/ocx/Pictures/pfp.png
    size = 96
    rounding = -1
    border_size = 0
    position = 0, -156
    halign = center
    valign = center
}

# user name
label {
    monitor =
    text = <span font_weight='600'>$USER</span>
    color = rgb(255, 255, 255)
    font_size = 14
    font_family = SF Pro Display
    position = 0, -228
    halign = center
    valign = center
}

# password pill
input-field {
    monitor =
    size = 140, 24
    rounding = -1
    outline_thickness = 1
    outer_color = rgba(255, 255, 255, 0.40)
    inner_color = rgba(255, 255, 255, 0.30)
    font_color = rgb(255, 255, 255)
    font_family = SF Pro Display
    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true
    fade_on_empty = false
    placeholder_text = <span foreground="##ffffffd8">Enter Password</span>
    check_color = rgba(255, 255, 255, 0.55)
    fail_color = rgba(255, 110, 110, 0.75)
    fail_text = Incorrect password
    capslock_color = rgba(255, 214, 10, 0.7)
    position = 0, -266
    halign = center
    valign = center
}

# photo caption, written next to the photo by sddm/wallpaper.sh
label {
    monitor =
    text = cmd[update:300000] cat /usr/share/sddm/themes/glass/backgrounds/caption.txt 2>/dev/null
    color = rgba(255, 255, 255, 0.75)
    font_size = 9
    font_family = SF Pro Display
    position = 0, 24
    halign = center
    valign = bottom
}
