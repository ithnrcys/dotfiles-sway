# Headphone correction for the Sennheiser HD 599 as a virtual output, "HD 599 EQ".
# Everything played into it is equalised and passed on to the USB DAC (PCM2900C).
# The curve is the AutoEq result for oratory1990's measurement of the HD 599 (target:
# Harman over-ear) — ten filters plus a -6.2 dB preamp so the boosts cannot clip:
#   https://github.com/jaakkopasanen/AutoEq  results/oratory1990/over-ear/Sennheiser HD 599
# Loaded by the filter-chain user service (systemctl --user enable --now filter-chain),
# linked as ~/.config/pipewire/filter-chain.conf.d/hd599-eq.conf.
# To hear the headphones without it, pick the DAC itself as output (bar volume menu or pavucontrol).
context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "HD 599 EQ"
            media.name       = "HD 599 EQ"
            filter.graph = {
                nodes = [
                    {
                        type   = builtin
                        name   = eq
                        label  = param_eq
                        config = { filename = "/home/ocx/.dotfiles/pipewire/hd599-oratory1990.txt" }
                    }
                ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name   = "hd599_eq"
                media.class = Audio/Sink
            }
            playback.props = {
                node.name     = "hd599_eq.output"
                node.passive  = true
                target.object = "alsa_output.usb-BurrBrown_from_Texas_Instruments_USB_AUDIO_CODEC-00.analog-stereo"
            }
        }
    }
]
