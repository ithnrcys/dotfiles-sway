# Sample rates and resampling (linked into ~/.config/pipewire/pipewire.conf.d/).
# The DAC (PCM2900C) plays 44.1 kHz and 48 kHz natively: allow both, so 44.1 kHz music
# (CDs, most streaming) is sent as it is instead of being converted to 48 kHz. The rate
# only switches while nothing else is playing.
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 44100 48000 ]
}
# when a conversion is needed anyway, use the best resampler (default is 4 of 0..14)
stream.properties = {
    resample.quality = 10
}
